name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
          - "truffleruby"
          - "truffleruby-head"

    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle install --jobs 4

      - name: Install Chromium for browser tests
        run: bundle exec qd browser install chromium

      - name: Quickdraw Tests
        # Without fork, config.browser runs only Chromium, and --browser needs several.
        run: bundle exec qd all ${{ !startsWith(matrix.ruby-version, 'truffleruby') && '--browser chromium' || '' }}

  native:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        # The C extension supports the latest stable Ruby.
        ruby-version:
          - "4.0"
          - "head"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle install --jobs 4

      - name: Install Chromium for browser tests
        run: bundle exec qd browser install chromium

      - name: Compile the C extension
        run: bundle exec rake compile

      - name: Quickdraw Tests
        env:
          PHLEX_NATIVE: "true"
          PHLEX_NATIVE_ITERATIONS: "200000"
        run: bundle exec qd all --browser chromium

  # A Ruby built with AddressSanitizer, since preloading it into a normal Ruby doesn't work.
  native-sanitizers:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "asan-release"
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle install --jobs 4

      - name: Compile the C extension with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          PHLEX_NATIVE_SANITIZE: "true"
        run: bundle exec rake compile

      - name: Differential tests while the GC compacts and runs constantly
        env:
          PHLEX_NATIVE: "true"
          PHLEX_NATIVE_STRESS: "true"
          PHLEX_NATIVE_SANITIZE: "true"
          ASAN_OPTIONS: "detect_leaks=0"
        run: bundle exec qd ./quickdraw/native/attributes.test.rb

  # Installs the built gem the way users do, checking the C extension is built only where it can be.
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby-version: "4.0", native: true }
          - { ruby-version: "4.0", native: false, hide-compiler: true }
          - { ruby-version: "3.3", native: false }
          - { ruby-version: "jruby", native: false }
          - { ruby-version: "truffleruby", native: false }

    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Build the gem
        run: gem build phlex.gemspec --output phlex.gem

      # Phlex's dependencies have C extensions too, so they're installed first.
      - name: Hide the C compiler
        if: matrix.hide-compiler
        run: |
          gem install ./phlex.gem && gem uninstall phlex --executables
          mkdir "$RUNNER_TEMP/no-compiler"
          for name in gcc cc clang; do
            printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/no-compiler/$name"
            chmod +x "$RUNNER_TEMP/no-compiler/$name"
          done
          echo "$RUNNER_TEMP/no-compiler" >> "$GITHUB_PATH"

      - name: Install the gem
        run: gem install ./phlex.gem --verbose

      - name: Render
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          ruby -e '
            require "phlex"
            native = !!defined?(Phlex::Native)
            abort "Expected the C extension to be #{ENV["NATIVE"] == "true" ? "loaded" : "missing"}." unless native == (ENV["NATIVE"] == "true")
            output = Class.new(Phlex::HTML) { def view_template = a(href: "/", class: ["a", :b]) { "Hi" } }.call
            abort output unless output == %(<a href="/" class="a b">Hi</a>)
            puts "Rendered #{native ? "with" : "without"} the C extension."
          '

  rubocop:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle install --jobs 4

      - name: Rubocop
        run: bundle exec rubocop
