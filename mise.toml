[tasks.setup]
description = "Install all project dependencies."
run = ["mise install", "bundle install --jobs 4", "bundle exec qd browser install"]

[tasks.test]
description = "Run tests"
run = ["bundle exec qd"]

[tasks.lint]
description = "Run linter"
run = "bundle exec rubocop"

[tasks.integrate]
description = "Run tests and linter"
run = ["mise run test", "mise run lint"]

[tasks.update]
description = "Update project dependencies"
run = ["mise upgrade --bump", "bundle update --jobs 4"]

[tasks.bench]
description = "Run benchmarks"
run = ["bundle exec ruby benchmarks/compiler.rb"]

[tasks.browser_tests]
description = "Run browser tests in Chromium and WebKit"
run = ["bundle exec qd browser"]

[tasks."native:compile"]
description = "Compile the C extension from source"
run = "bundle exec rake compile"

[tasks."native:test"]
description = "Run tests with the C extension loaded"
depends = ["native:compile"]
env = { PHLEX_NATIVE = "true" }
run = "bundle exec qd"

[tasks."native:clean"]
description = "Remove the compiled C extension"
run = "bundle exec rake clobber"

[tools]
ruby = "latest"
node = "latest"
