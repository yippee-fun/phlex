[tasks.setup]
description = "Install all project dependencies."
run = ["mise install", "bundle install --jobs 4", "bundle install --jobs 4 --gemfile phlex-native/Gemfile", "bundle exec qd browser install"]

[tasks.test]
description = "Run tests"
run = ["bundle exec qd"]

[tasks.lint]
description = "Run linter"
run = "bundle exec rubocop"

[tasks.integrate]
description = "Run tests and linter"
run = ["mise run test", "mise run lint"]

[tasks.update]
description = "Update project dependencies"
run = ["mise upgrade --bump", "bundle update --jobs 4"]

[tasks.bench]
description = "Run benchmarks"
run = ["bundle exec ruby benchmarks/compiler.rb"]

[tasks.browser_tests]
description = "Run browser tests in Chromium and WebKit"
run = ["bundle exec qd browser"]

[tasks."native:compile"]
description = "Compile phlex-native from source"
dir = "phlex-native"
run = "bundle exec rake compile"

[tasks."native:test"]
description = "Run tests with phlex-native loaded"
depends = ["native:compile"]
env = { PHLEX_NATIVE = "true" }
run = "bundle exec qd"

[tasks."native:package"]
description = "Build the phlex-native gem"
dir = "phlex-native"
run = ["bundle exec rake clobber", "bundle exec rake gem"]

[tasks."native:release"]
description = "Push the phlex-native gem in phlex-native/pkg to RubyGems"
dir = "phlex-native"
run = "gem push pkg/*.gem"

[tools]
ruby = "latest"
node = "latest"
